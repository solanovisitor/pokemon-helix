name: Deterministic host checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGGRAPH_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.12"
          enable-cache: false
      - run: uv sync --locked --python 3.12 --extra generation
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m companion.demo
      - run: uv run --locked python platform/rg34xx/smoke.py
      - run: uv run --locked python scripts/check-public.py
      - run: uv run --locked python scripts/check-public-native-fixtures.py
      - run: uv run --locked python scripts/smoke-agent-tools.py
  container:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the allowlisted Linux ARM64 service
        run: docker build --platform linux/arm64 -f platform/rg34xx/Dockerfile -t helix-lab-ci .
      - name: Exercise isolated socket and restart persistence
        run: >-
          docker run --rm --platform linux/arm64 --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1
          helix-lab-ci
      - name: Build the allowlisted C model check
        run: docker build --platform linux/arm64 -f platform/rg34xx/Dockerfile.indicator -t helix-indicator-ci .
      - name: Verify C and Python numeric equivalence
        run: >-
          docker run --rm --platform linux/arm64 --network none --read-only
          --tmpfs /tmp:rw,exec,nosuid,size=64m --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64 --memory 512m --cpus 1
          helix-indicator-ci
